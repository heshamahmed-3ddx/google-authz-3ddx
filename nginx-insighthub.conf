server {
    listen 80;
    server_name insighthub.3ddx.link;
    root /home/hesham/InsightHub/client/dist;
    index index.html;

    # Proxy auth routes FIRST (Google OAuth) - exact match takes priority
    location ~ ^/auth/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie rewrite for session persistence
        proxy_cookie_path / /;
        proxy_cookie_domain localhost insighthub.3ddx.link;
    }

    # Proxy API routes
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie rewrite for session persistence
        proxy_cookie_path / /;
        proxy_cookie_domain localhost insighthub.3ddx.link;
    }

    # Proxy admin routes (for group management, etc.)
    # Rewrite /admin/* to /api/admin/* for backend
    location /admin/ {
        rewrite ^/admin/(.*)$ /api/admin/$1 break;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie rewrite for session persistence
        proxy_cookie_path / /;
        proxy_cookie_domain localhost insighthub.3ddx.link;
    }

    # Proxy docs route (Swagger)
    location /docs {
        proxy_pass http://localhost:3001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Vue app for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
