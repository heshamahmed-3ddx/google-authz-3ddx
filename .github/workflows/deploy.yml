name: Deploy InsightHub

on:
  push:
    branches:
      - main
      - staging
      - feature/admin-settings-permissions-ui
  pull_request:
    branches:
      - main
      - staging

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm run test:unit || echo "No tests configured"

      - name: Run server tests
        working-directory: ./server
        run: npm test || echo "No tests configured"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build -- --mode production

      - name: Upload client build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: |
            server/
            !server/node_modules
            !server/.env
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/feature/admin-settings-permissions-ui'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client/dist

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "path=/home/hesham/InsightHub" >> $GITHUB_OUTPUT
            echo "pm2_env=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "path=/home/hesham/InsightHub-staging" >> $GITHUB_OUTPUT
            echo "pm2_env=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=feature" >> $GITHUB_OUTPUT
            echo "path=/home/hesham/InsightHub-feature" >> $GITHUB_OUTPUT
            echo "pm2_env=development" >> $GITHUB_OUTPUT
          fi

      - name: Copy built files to deployment directory
        run: |
          rsync -av --delete ./client/dist/ ${{ steps.env.outputs.path }}/client/dist/

      - name: Create environment file
        working-directory: ./server
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=3001
          
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
          
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CLIENT_URL=${{ vars.CLIENT_URL }}
          
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ vars.DB_NAME }}
          
          POWERBI_WORKSPACE_ID=${{ vars.POWERBI_WORKSPACE_ID }}
          POWERBI_REPORT_ID=${{ vars.POWERBI_REPORT_ID }}
          POWERBI_TENANT_ID=${{ vars.POWERBI_TENANT_ID }}
          POWERBI_CLIENT_ID=${{ vars.POWERBI_CLIENT_ID }}
          POWERBI_CLIENT_SECRET=${{ secrets.POWERBI_CLIENT_SECRET }}
          EOF

      - name: Stop PM2 processes
        run: |
          pm2 stop insighthub-backend-${{ steps.env.outputs.environment }} || true

      - name: Install server dependencies
        working-directory: ./server
        run: npm install --production

      - name: Start/Restart PM2
        working-directory: ./server
        run: |
          pm2 restart ecosystem.config.cjs --env ${{ steps.env.outputs.pm2_env }} --name insighthub-backend-${{ steps.env.outputs.environment }} --update-env || pm2 start ecosystem.config.cjs --env ${{ steps.env.outputs.pm2_env }} --name insighthub-backend-${{ steps.env.outputs.environment }}
          pm2 save
