name: Deploy InsightHub

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm run test:unit || echo "No tests configured"

      - name: Run server tests
        working-directory: ./server
        run: npm test || echo "No tests configured"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_POWERBI_WORKSPACE_ID: ${{ secrets.VITE_POWERBI_WORKSPACE_ID }}
          VITE_POWERBI_REPORT_ID: ${{ secrets.VITE_POWERBI_REPORT_ID }}
          VITE_POWERBI_TENANT_ID: ${{ secrets.VITE_POWERBI_TENANT_ID }}
          VITE_POWERBI_CLIENT_ID: ${{ secrets.VITE_POWERBI_CLIENT_ID }}
        run: npm run build

      - name: Upload client build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: |
            server/
            !server/node_modules
            !server/.env
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client/dist

      - name: Stop PM2 processes
        run: |
          pm2 stop insighthub-backend || true

      - name: Install server dependencies
        working-directory: ./server
        run: npm install --production

      - name: Start/Restart PM2
        run: |
          pm2 restart server/ecosystem.config.cjs --env production || pm2 start server/ecosystem.config.cjs --env production
          pm2 save
