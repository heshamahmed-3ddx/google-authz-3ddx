name: Deploy InsightHub

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        working-directory: ./client
        run: npm run test:unit || echo "No tests configured"

      - name: Run server tests
        working-directory: ./server
        run: npm test || echo "No tests configured"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build -- --mode production

      - name: Upload client build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: |
            server/
            !server/node_modules
            !server/.env
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client/dist

      - name: Copy built files to production directory
        run: |
          rsync -av --delete ./client/dist/ /home/hesham/InsightHub/client/dist/

      - name: Stop PM2 processes
        run: |
          pm2 stop insighthub-backend || true

      - name: Install server dependencies
        working-directory: ./server
        run: npm install --production

      - name: Start/Restart PM2
        working-directory: ./server
        run: |
          pm2 restart ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production
          pm2 save
