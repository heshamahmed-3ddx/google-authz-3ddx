<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <!-- Inline SVG favicon to avoid missing /vite.svg in headless runs -->
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%23007ACC%22/><text x=%228%22 y=%2211%22 font-size=%229%22 font-family=%22Arial,Helvetica,sans-serif%22 fill=%22white%22 text-anchor=%22middle%22>G</text></svg>' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to API server for faster requests -->
    <link rel="preconnect" href="http://localhost:3001" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:3001" />
    
    <!-- Performance optimizations -->
    <style>
      /* Critical CSS for faster initial render */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        font-display: swap;
      }
      #app {
        min-height: 100vh;
      }
      /* Prevent layout shift */
      .v-application {
        font-display: swap;
      }
      
      /* Initial loading spinner - shows before Vue mounts */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }
      
      #initial-loader.dark {
        background: #1e1e1e;
      }
      
      .spinner {
        width: 64px;
        height: 64px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #ff6b35;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loader once app is mounted */
      .app-mounted #initial-loader {
        display: none;
      }
    </style>
    
    <title>Google AuthZ 3DDX</title>
  </head>
  <body>
    <!-- Initial loading spinner -->
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
