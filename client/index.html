<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Updated favicon -->
    <!-- Favicon: ICO for best browser compatibility, PNG as fallback -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#146c9c" />
    <meta name="description" content="Comprehensive authorization and management system for 3DDX platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InsightHub" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    
    <title>InsightHub - 3DDX</title>
    
    <!-- Google Fonts - Professional Arabic & Latin fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Preconnect to API server for faster requests -->
    <link rel="preconnect" href="http://localhost:3001" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:3001" />
    
    <!-- PowerBI Client SDK - unpkg CDN -->
    <script src="https://unpkg.com/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
    
    <!-- Performance optimizations -->
    <style>
      /* Critical CSS for faster initial render */
      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-display: swap;
      }
      
      /* Arabic font */
      [dir="rtl"] *,
      [dir="rtl"] body,
      [dir="rtl"] .v-application,
      [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, 
      [dir="rtl"] h4, [dir="rtl"] h5, [dir="rtl"] h6,
      [dir="rtl"] p, [dir="rtl"] span, [dir="rtl"] div {
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      
      #app {
        min-height: 100vh;
      }
      /* Prevent layout shift */
      .v-application {
        font-display: swap;
      }
      
      /* Initial loader removed — GlobalLoader & route progress handle loading visuals */
    </style>
    
    <title>Google AuthZ 3DDX</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
